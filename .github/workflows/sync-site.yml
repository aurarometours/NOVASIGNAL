name: Sync site bundle

# Publishes the static NovaSignal build: downloads the bundle listed in
# site-bundle.txt, verifies its SHA-256 and replaces the site files on this
# branch. GitHub Pages then serves the new commit.
on:
  push:
    branches: [gh-pages]
    paths: [site-bundle.txt]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-site
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Download and verify bundle
        run: |
          read -r URL SHA < site-bundle.txt
          curl -fsSL --retry 3 "$URL" -o "$RUNNER_TEMP/site.zip"
          echo "$SHA  $RUNNER_TEMP/site.zip" | sha256sum -c -

      - name: Replace site files
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name site-bundle.txt ! -name nova3 -exec rm -rf {} +
          unzip -q "$RUNNER_TEMP/site.zip" -d .
          touch .nojekyll

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Publish NovaSignal site bundle"
          git push origin HEAD:gh-pages
